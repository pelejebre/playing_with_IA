<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game by Copilot</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
        }
        .title-letter {
            display: inline-block;
            margin: 0 5px;
        }
        .title-S { color: #ff0000; }
        .title-N { color: #00ff00; }
        .title-A { color: #0000ff; }
        .title-K { color: #ffff00; }
        .title-E { color: #ff00ff; }
        .title-G { color: #00ffff; }
        .title-A2 { color: #ffa500; }
        .title-M { color: #800080; }
        .game-container {
            border: 2px solid #fff;
            background-color: #000;
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 20px;
        }
        .snake-segment, .food {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: all 0.1s ease;
        }
        .snake-segment {
            background-color: #0f0;
        }
        .snake-segment.collision {
            background-color: #f00;
        }
        .food {
            background-color: #f00;
        }
        .play-button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0f0;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .play-button:hover {
            background-color: #00ff00;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .game-over button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>
        <span class="title-letter title-S">S</span>
        <span class="title-letter title-N">N</span>
        <span class="title-letter title-A">A</span>
        <span class="title-letter title-K">K</span>
        <span class="title-letter title-E">E</span>
        <span class="title-letter title-G">G</span>
        <span class="title-letter title-A2">A</span>
        <span class="title-letter title-M">M</span>
        <span class="title-letter title-E">E</span>
    </h1>
    <div class="game-container" id="game-container">
        <!-- Game elements will be added here -->
    </div>
    <button class="play-button" id="play-button">PLAY</button>

    <script>
        class SnakeGame {
            constructor() {
                this.gameContainer = document.getElementById('game-container');
                this.playButton = document.getElementById('play-button');
                this.snake = [{ x: 200, y: 200 }];
                this.direction = { x: 0, y: 0 };
                this.food = this.generateFood();
                this.score = 0;
                this.gameRunning = false;
                this.gameOver = false;
                this.speed = 200; // Initial speed in ms
                this.maxLength = 20;
                this.init();
            }

            init() {
                this.playButton.addEventListener('click', () => this.startGame());
                document.addEventListener('keydown', (e) => this.changeDirection(e));
            }

            startGame() {
                if (this.gameRunning) return;
                this.gameRunning = true;
                this.gameOver = false;
                this.playButton.style.display = 'none';
                this.clearGameOver();
                this.gameLoop();
            }

            changeDirection(event) {
                if (!this.gameRunning) return;
                const key = event.key;
                if (key === 'ArrowUp' && this.direction.y === 0) {
                    this.direction = { x: 0, y: -20 };
                } else if (key === 'ArrowDown' && this.direction.y === 0) {
                    this.direction = { x: 0, y: 20 };
                } else if (key === 'ArrowLeft' && this.direction.x === 0) {
                    this.direction = { x: -20, y: 0 };
                } else if (key === 'ArrowRight' && this.direction.x === 0) {
                    this.direction = { x: 20, y: 0 };
                }
            }

            generateFood() {
                let food;
                do {
                    food = {
                        x: Math.floor(Math.random() * 20) * 20,
                        y: Math.floor(Math.random() * 20) * 20
                    };
                } while (this.snake.some(segment => segment.x === food.x && segment.y === food.y));
                return food;
            }

            moveSnake() {
                const head = { x: this.snake[0].x + this.direction.x, y: this.snake[0].y + this.direction.y };
                this.snake.unshift(head);

                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score++;
                    this.food = this.generateFood();
                    this.increaseSpeed();
                } else {
                    this.snake.pop();
                }
            }

            increaseSpeed() {
                if (this.speed > 50) {
                    this.speed -= 5; // Increase speed slightly
                }
            }

            checkCollision() {
                const head = this.snake[0];
                // Wall collision
                if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) {
                    return true;
                }
                // Self collision
                for (let i = 1; i < this.snake.length; i++) {
                    if (head.x === this.snake[i].x && head.y === this.snake[i].y) {
                        return true;
                    }
                }
                // Win condition
                if (this.snake.length >= this.maxLength) {
                    return true;
                }
                return false;
            }

            render() {
                this.gameContainer.innerHTML = '';
                // Render snake
                this.snake.forEach(segment => {
                    const snakeElement = document.createElement('div');
                    snakeElement.className = 'snake-segment';
                    snakeElement.style.left = segment.x + 'px';
                    snakeElement.style.top = segment.y + 'px';
                    this.gameContainer.appendChild(snakeElement);
                });
                // Render food
                const foodElement = document.createElement('div');
                foodElement.className = 'food';
                foodElement.style.left = this.food.x + 'px';
                foodElement.style.top = this.food.y + 'px';
                this.gameContainer.appendChild(foodElement);
            }

            gameLoop() {
                if (!this.gameRunning) return;
                this.moveSnake();
                if (this.checkCollision()) {
                    this.endGame();
                    return;
                }
                this.render();
                setTimeout(() => this.gameLoop(), this.speed);
            }

            endGame() {
                this.gameRunning = false;
                this.gameOver = true;
                // Change snake color to red
                document.querySelectorAll('.snake-segment').forEach(segment => {
                    segment.classList.add('collision');
                });
                // Show game over message
                const gameOverDiv = document.createElement('div');
                gameOverDiv.className = 'game-over';
                gameOverDiv.innerHTML = `
                    <h2>GAME OVER</h2>
                    <p>Score: ${this.score}</p>
                    <button onclick="location.reload()">Restart</button>
                    <button onclick="window.close()">Exit</button>
                `;
                this.gameContainer.appendChild(gameOverDiv);
            }

            clearGameOver() {
                const gameOver = document.querySelector('.game-over');
                if (gameOver) gameOver.remove();
            }
        }

        new SnakeGame();
    </script>
</body>
</html>
