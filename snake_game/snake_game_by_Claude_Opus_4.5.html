<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
        }

        .title {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            animation: titleFloat 2s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title span {
            font-size: 36px;
            text-shadow: 
                3px 3px 0 #000,
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                0 4px 8px rgba(0, 0, 0, 0.5);
            animation: letterPulse 1.5s ease-in-out infinite;
        }

        .title span:nth-child(1) { color: #ff6b6b; animation-delay: 0s; }
        .title span:nth-child(2) { color: #ffd93d; animation-delay: 0.1s; }
        .title span:nth-child(3) { color: #6bcb77; animation-delay: 0.2s; }
        .title span:nth-child(4) { color: #4d96ff; animation-delay: 0.3s; }
        .title span:nth-child(5) { color: #9b59b6; animation-delay: 0.4s; }
        .title span:nth-child(6) { color: #ff6b6b; animation-delay: 0.5s; }
        .title span:nth-child(7) { color: #ffd93d; animation-delay: 0.6s; }
        .title span:nth-child(8) { color: #6bcb77; animation-delay: 0.7s; }
        .title span:nth-child(9) { color: #4d96ff; animation-delay: 0.8s; }
        .title span:nth-child(10) { color: #9b59b6; animation-delay: 0.9s; }

        @keyframes letterPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .score-display {
            color: #fff;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-board {
            position: relative;
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #1a1a1a 25%, #222 25%, #222 50%, #1a1a1a 50%, #1a1a1a 75%, #222 75%);
            background-size: 40px 40px;
            border: 4px solid #4d96ff;
            border-radius: 10px;
            box-shadow: 
                0 0 20px rgba(77, 150, 255, 0.5),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .snake-segment {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #6bcb77 0%, #4aa858 100%);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(107, 203, 119, 0.5);
            transition: left 0.05s linear, top 0.05s linear;
        }

        .snake-segment.head {
            background: linear-gradient(135deg, #8ade8f 0%, #6bcb77 100%);
            border-radius: 6px;
            z-index: 10;
        }

        .snake-segment.head::before,
        .snake-segment.head::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            top: 4px;
        }

        .snake-segment.head::before {
            left: 4px;
        }

        .snake-segment.head::after {
            right: 4px;
        }

        .snake-segment.dead {
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%) !important;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.7);
        }

        .food {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b 0%, #c0392b 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.7);
            animation: foodPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes foodPulse {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .btn {
            padding: 15px 40px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(135deg, #4d96ff 0%, #3a7bd5 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 
                0 6px 0 #2962c0,
                0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 #2962c0,
                0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 #2962c0,
                0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-restart {
            background: linear-gradient(135deg, #6bcb77 0%, #4aa858 100%);
            box-shadow: 
                0 6px 0 #3d8a47,
                0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-restart:hover {
            box-shadow: 
                0 8px 0 #3d8a47,
                0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-restart:active {
            box-shadow: 
                0 2px 0 #3d8a47,
                0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-exit {
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%);
            box-shadow: 
                0 6px 0 #962d22,
                0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-exit:hover {
            box-shadow: 
                0 8px 0 #962d22,
                0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-exit:active {
            box-shadow: 
                0 2px 0 #962d22,
                0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            border-radius: 6px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .overlay-title {
            font-size: 24px;
            color: #ff6b6b;
            text-shadow: 
                2px 2px 0 #000,
                0 0 20px rgba(255, 107, 107, 0.7);
            animation: gameOverPulse 0.5s ease-in-out infinite alternate;
        }

        .overlay-title.win {
            color: #6bcb77;
            text-shadow: 
                2px 2px 0 #000,
                0 0 20px rgba(107, 203, 119, 0.7);
        }

        @keyframes gameOverPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .overlay-score {
            font-size: 14px;
            color: #ffd93d;
        }

        .overlay-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .overlay-buttons .btn {
            padding: 12px 25px;
            font-size: 12px;
        }

        .instructions {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            text-align: center;
            line-height: 1.8;
        }

        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }

        .start-overlay .start-text {
            color: #4d96ff;
            font-size: 18px;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">
            <span>S</span>
            <span>N</span>
            <span>A</span>
            <span>K</span>
            <span>E</span>
            <span>&nbsp;</span>
            <span>G</span>
            <span>A</span>
            <span>M</span>
            <span>E</span>
        </div>

        <div class="score-display">SCORE: <span id="score">0</span> / 20</div>

        <div class="game-board" id="gameBoard">
            <div class="start-overlay" id="startOverlay">
                <span class="start-text">PRESS PLAY</span>
            </div>
            <div class="overlay" id="gameOverlay">
                <div class="overlay-title" id="overlayTitle">GAME OVER</div>
                <div class="overlay-score" id="overlayScore">Score: 0</div>
                <div class="overlay-buttons">
                    <button class="btn btn-restart" id="restartBtn">RESTART</button>
                    <button class="btn btn-exit" id="exitBtn">EXIT</button>
                </div>
            </div>
        </div>

        <button class="btn" id="playBtn">PLAY</button>

        <div class="instructions">
            Use arrow keys to move<br>
            Eat food to grow • Reach 20 to win!
        </div>
    </div>

    <script>
        class SnakeGame {
            constructor() {
                this.board = document.getElementById('gameBoard');
                this.scoreDisplay = document.getElementById('score');
                this.playBtn = document.getElementById('playBtn');
                this.startOverlay = document.getElementById('startOverlay');
                this.gameOverlay = document.getElementById('gameOverlay');
                this.overlayTitle = document.getElementById('overlayTitle');
                this.overlayScore = document.getElementById('overlayScore');
                this.restartBtn = document.getElementById('restartBtn');
                this.exitBtn = document.getElementById('exitBtn');

                this.gridSize = 20;
                this.boardSize = 400;
                this.cellCount = this.boardSize / this.gridSize;

                this.snake = [];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.food = null;
                this.score = 0;
                this.isRunning = false;
                this.isGameOver = false;
                this.gameLoop = null;
                this.baseSpeed = 150;
                this.currentSpeed = this.baseSpeed;

                this.snakeElements = [];
                this.foodElement = null;

                this.init();
            }

            init() {
                this.playBtn.addEventListener('click', () => this.startGame());
                this.restartBtn.addEventListener('click', () => this.restartGame());
                this.exitBtn.addEventListener('click', () => this.exitGame());
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
            }

            startGame() {
                if (this.isRunning) return;

                this.resetGame();
                this.startOverlay.classList.add('hidden');
                this.gameOverlay.classList.remove('visible');
                this.playBtn.textContent = 'PLAYING...';
                this.playBtn.disabled = true;

                this.isRunning = true;
                this.isGameOver = false;

                this.createSnake();
                this.spawnFood();
                this.render();
                this.runGameLoop();
            }

            resetGame() {
                this.snake = [{ x: 10, y: 10 }];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.currentSpeed = this.baseSpeed;
                this.updateScore();

                this.clearBoard();
            }

            clearBoard() {
                this.snakeElements.forEach(el => el.remove());
                this.snakeElements = [];
                if (this.foodElement) {
                    this.foodElement.remove();
                    this.foodElement = null;
                }
            }

            createSnake() {
                this.snake.forEach((segment, index) => {
                    const element = document.createElement('div');
                    element.className = 'snake-segment' + (index === 0 ? ' head' : '');
                    element.style.left = segment.x * this.gridSize + 'px';
                    element.style.top = segment.y * this.gridSize + 'px';
                    this.board.appendChild(element);
                    this.snakeElements.push(element);
                });
            }

            spawnFood() {
                let newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * this.cellCount),
                        y: Math.floor(Math.random() * this.cellCount)
                    };
                } while (this.isOnSnake(newFood));

                this.food = newFood;

                if (!this.foodElement) {
                    this.foodElement = document.createElement('div');
                    this.foodElement.className = 'food';
                    this.board.appendChild(this.foodElement);
                }

                this.foodElement.style.left = this.food.x * this.gridSize + 'px';
                this.foodElement.style.top = this.food.y * this.gridSize + 'px';
            }

            isOnSnake(pos) {
                return this.snake.some(segment => segment.x === pos.x && segment.y === pos.y);
            }

            handleKeyPress(e) {
                if (!this.isRunning || this.isGameOver) return;

                const keyMap = {
                    'ArrowUp': { x: 0, y: -1 },
                    'ArrowDown': { x: 0, y: 1 },
                    'ArrowLeft': { x: -1, y: 0 },
                    'ArrowRight': { x: 1, y: 0 }
                };

                const newDir = keyMap[e.key];
                if (newDir) {
                    e.preventDefault();
                    
                    // Prevent reversing direction
                    if (newDir.x !== -this.direction.x || newDir.y !== -this.direction.y) {
                        this.nextDirection = newDir;
                    }
                }
            }

            runGameLoop() {
                if (this.gameLoop) clearTimeout(this.gameLoop);

                this.gameLoop = setTimeout(() => {
                    if (this.isRunning && !this.isGameOver) {
                        this.update();
                        this.runGameLoop();
                    }
                }, this.currentSpeed);
            }

            update() {
                this.direction = { ...this.nextDirection };

                const head = {
                    x: this.snake[0].x + this.direction.x,
                    y: this.snake[0].y + this.direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= this.cellCount || 
                    head.y < 0 || head.y >= this.cellCount) {
                    this.endGame(false);
                    return;
                }

                // Check self collision
                if (this.isOnSnake(head)) {
                    this.endGame(false);
                    return;
                }

                this.snake.unshift(head);

                // Check food collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score++;
                    this.updateScore();

                    // Check win condition
                    if (this.score >= 20) {
                        this.endGame(true);
                        return;
                    }

                    this.spawnFood();
                    this.increaseSpeed();

                    // Add new segment element
                    const element = document.createElement('div');
                    element.className = 'snake-segment';
                    this.board.appendChild(element);
                    this.snakeElements.push(element);
                } else {
                    this.snake.pop();
                }

                this.render();
            }

            render() {
                this.snake.forEach((segment, index) => {
                    if (this.snakeElements[index]) {
                        const el = this.snakeElements[index];
                        el.style.left = segment.x * this.gridSize + 'px';
                        el.style.top = segment.y * this.gridSize + 'px';
                        
                        if (index === 0) {
                            el.className = 'snake-segment head';
                        } else {
                            el.className = 'snake-segment';
                        }
                    }
                });
            }

            increaseSpeed() {
                // Increase speed by 5% for each food eaten, with a minimum of 50ms
                this.currentSpeed = Math.max(50, this.baseSpeed - (this.score * 5));
            }

            updateScore() {
                this.scoreDisplay.textContent = this.score;
            }

            endGame(isWin) {
                this.isRunning = false;
                this.isGameOver = true;

                if (this.gameLoop) {
                    clearTimeout(this.gameLoop);
                    this.gameLoop = null;
                }

                // Change snake color to red if lost
                if (!isWin) {
                    this.snakeElements.forEach(el => {
                        el.classList.add('dead');
                    });
                }

                // Show game over overlay
                setTimeout(() => {
                    if (isWin) {
                        this.overlayTitle.textContent = 'YOU WIN!';
                        this.overlayTitle.classList.add('win');
                    } else {
                        this.overlayTitle.textContent = 'GAME OVER';
                        this.overlayTitle.classList.remove('win');
                    }
                    this.overlayScore.textContent = `Score: ${this.score}`;
                    this.gameOverlay.classList.add('visible');
                }, 500);

                this.playBtn.textContent = 'PLAY';
                this.playBtn.disabled = false;
            }

            restartGame() {
                this.gameOverlay.classList.remove('visible');
                this.startGame();
            }

            exitGame() {
                this.isRunning = false;
                this.isGameOver = false;

                if (this.gameLoop) {
                    clearTimeout(this.gameLoop);
                    this.gameLoop = null;
                }

                this.clearBoard();
                this.score = 0;
                this.updateScore();

                this.gameOverlay.classList.remove('visible');
                this.startOverlay.classList.remove('hidden');
                this.playBtn.textContent = 'PLAY';
                this.playBtn.disabled = false;
            }
        }

        // Initialize the game when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new SnakeGame();
        });
    </script>
</body>
</html>
